<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ether Tarot - Three.js & MediaPipe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; color: #ddd; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .controls { background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #444; border-radius: 8px; }
        button { background: #222; color: #fff; border: 1px solid #666; padding: 5px 10px; cursor: pointer; transition: 0.3s; margin-bottom: 5px; width: 100%; }
        button:hover { background: #444; border-color: #aaa; }
        button.active { background: #004400; border-color: #0f0; }

        .status-panel { text-align: right; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; }
        #gesture-icon { font-size: 24px; display: inline-block; width: 30px; text-align: center; }
        
        /* Center Result Display */
        #result-display { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            text-align: center; opacity: 0; transition: opacity 1s; pointer-events: none;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0) 100%);
            padding: 40px; width: 100%;
        }
        #result-title { font-size: 3em; font-weight: bold; text-shadow: 0 0 10px #f0f; margin: 0; }
        #result-meaning { font-size: 1.2em; color: #aaa; margin-top: 10px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .reversed-tag { color: #ff4444; font-size: 0.6em; border: 1px solid #ff4444; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 10px; }

        #interaction-guidance {
            position: absolute; left: 50%; top: 70%; transform: translate(-50%, -50%);
            color: #e1be68; font-size: clamp(1rem, 2.4vw, 1.35rem); letter-spacing: 0.12em;
            text-align: center; text-shadow: 0 0 12px rgba(225, 190, 104, 0.75);
            pointer-events: none; white-space: nowrap;
        }

        /* History Panel */
        #history-panel { 
            pointer-events: auto; background: rgba(10,10,15,0.8); border-top: 2px solid #333; 
            height: 150px; overflow-y: auto; padding: 10px; margin-bottom: 0; font-size: 0.9em;
            scrollbar-width: thin; scrollbar-color: #444 #111;
        }
        .history-item { border-bottom: 1px solid #333; padding: 5px 0; display: flex; justify-content: space-between; }
        .history-name { color: #dcb; }
        
        /* Video hidden but needed for MediaPipe */
        #input_video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: #0ff; z-index: 10; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="input_video"></video>
    <div id="loading">初始化神谕系统 (加载模型中)...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="controls">
                <h3>🔮 Ether Tarot</h3>
                <button id="btn-mode">切换模式: ✋ 手势</button>
                <div style="font-size: 0.8em; margin-top: 5px; color: #aaa;">
                    ✋ 张开: 悬停<br>
                    👌 捏合: 抓牌<br>
                    ✊ 握拳: 确认揭示
                </div>
            </div>
            <div class="status-panel">
                <div>状态: <span id="status-text" style="color:cyan">等待连接...</span> <span id="gesture-icon">-</span></div>
                <div style="font-size:0.8em; color:#888;">剩余卡牌: <span id="deck-count">78</span></div>
            </div>
        </div>

        <div id="result-display">
            <h1 id="result-title">THE FOOL</h1>
            <div id="result-meaning">The beginning of a journey, innocence, spontaneity.</div>
        </div>

        <div id="interaction-guidance" aria-live="polite"></div>

        <div id="history-panel">
            <div style="color: #666; font-style: italic;">抽卡记录...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import {
            createInteractionState,
            createInputEdgeState,
            isPointInsideDeckTarget,
            isPointInsideRevealZone,
            resetInputEdgeState,
            transitionInteraction,
            updateInputEdgeState,
        } from "./src/interaction-state.mjs";

        let interaction = createInteractionState();
        let inputEdges = createInputEdgeState();

        function dispatchInteraction(event) {
            const previousPhase = interaction.phase;
            interaction = transitionInteraction(interaction, event);
            renderGuidance(interaction.phase);
            setDeckVisualState(interaction.phase);
            setRevealZoneVisualState(interaction.phase);

            if (interaction.phase === "DRAGGING" && previousPhase !== "DRAGGING" && !STATE.heldCard) {
                createHeldCard();
            }

            if (interaction.phase === "REVEALED" && previousPhase !== "REVEALED") {
                confirmResult();
            }

            return interaction;
        }

        // --- Configuration ---
        const CONFIG = {
            cardWidth: 2.5,
            cardHeight: 4.3,
            zIndexPinch: 0.04, // Threshold for pinch
            cameraZ: 12,
            dragSpeed: 0.15,
            particleLife: 2.0 // Seconds
        };

        // --- State Management ---
        const STATE = {
            mode: 'gesture', // 'gesture' or 'mouse'
            gesture: 'NONE', // OPEN, PINCH, FIST, POINT
            handVisible: false,
            pointer: new THREE.Vector2(), // Normalized screen coordinates
            isInteracting: false, // Pinching or MouseDown
            heldCard: null, // The THREE object currently being dragged
            drawnCardData: null, // The data of the card being held
            deck: [], // Array of remaining card indices
            locked: false // If true, animation is playing, input blocked
        };

        // --- Tarot Data (Simplified RWS) ---
        // Using a placeholder generator for images, but mapping names correctly.
        // In a real app, replace `imageUrl` with real CDN links.
        const TAROT_DATA = [];
        const SUITS = ['Wands', 'Cups', 'Swords', 'Pentacles'];
        const RANKS = ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'];
        const MAJOR = [
            'The Fool', 'The Magician', 'The High Priestess', 'The Empress', 'The Emperor', 
            'The Hierophant', 'The Lovers', 'The Chariot', 'Strength', 'The Hermit', 
            'Wheel of Fortune', 'Justice', 'The Hanged Man', 'Death', 'Temperance', 
            'The Devil', 'The Tower', 'The Star', 'The Moon', 'The Sun', 
            'Judgement', 'The World'
        ];

        // Generate Data
        let idCounter = 0;
        // Majors
        MAJOR.forEach((name, i) => {
            TAROT_DATA.push({ 
                id: idCounter++, 
                name: name, 
                type: 'major',
                // Using local images
                img: `../tarot_img/${i < 10 ? '0' + i : i}.jpg`, 
                meaningUp: "新的开始，自由，纯真。", 
                meaningRev: "鲁莽，冒险，愚蠢。" 
            });
        });
        // Minors (Simplified generation for demo code length)
        SUITS.forEach(suit => {
            RANKS.forEach(rank => {
                TAROT_DATA.push({ 
                    id: idCounter++, 
                    name: `${rank} of ${suit}`, 
                    type: 'minor',
                    img: `../tarot_img/${suit}_${rank}.jpg`, 
                    meaningUp: `${suit} 正位含义 - 能量流动`, 
                    meaningRev: `${suit} 逆位含义 - 能量受阻` 
                });
            });
        });

        // Initialize Deck
        STATE.deck = TAROT_DATA.map(c => c.id);

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = CONFIG.cameraZ;
        camera.position.y = 2;
        camera.lookAt(0,0,0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffaa00, 1.5, 20);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // --- Texture Loader ---
        const textureLoader = new THREE.TextureLoader();
        const defaultFront = textureLoader.load('https://via.placeholder.com/300x520/222/555?text=Tarot');

        function createDeckFallbackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 520;
            const context = canvas.getContext('2d');
            const gold = '#d8ae52';

            context.fillStyle = '#1b0d31';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.strokeStyle = gold;
            context.lineWidth = 12;
            context.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);
            context.lineWidth = 3;
            context.strokeRect(32, 32, canvas.width - 64, canvas.height - 64);
            context.translate(canvas.width / 2, canvas.height / 2);
            context.fillStyle = gold;
            context.beginPath();
            for (let index = 0; index < 16; index += 1) {
                const angle = -Math.PI / 2 + index * Math.PI / 8;
                const radius = index % 2 === 0 ? 92 : 39;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (index === 0) context.moveTo(x, y);
                else context.lineTo(x, y);
            }
            context.closePath();
            context.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        const deckBackTexture = createDeckFallbackTexture();

        // --- Objects ---
        const cardGroup = new THREE.Group();
        scene.add(cardGroup);

        // Raycaster
        const raycaster = new THREE.Raycaster();
        const cursorMesh = new THREE.Mesh(
            new THREE.RingGeometry(0.1, 0.15, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
        );
        scene.add(cursorMesh);

        // Particle System (Ash)
        let particles = [];
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 4000;
        const pPos = new Float32Array(particleCount * 3);
        const pLife = new Float32Array(particleCount); // Life 0-1
        const pVel = new Float32Array(particleCount * 3);
        particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xccaa88,
            size: 0.08,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending
        });

        // Initialize particles off-screen
        for(let i=0; i<particleCount*3; i++) pPos[i] = 9999;
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- Central altar visuals ---
        const GUIDANCE_COPY = {
            IDLE: "将手移向命运牌堆",
            AIMING: "捏合抓取一张",
            DRAGGING: "将牌拖入中央揭示区",
            READY_TO_CONFIRM: "握拳确认揭示",
            REVEALED: "命运之牌已经揭示",
        };
        const guidanceElement = document.getElementById('interaction-guidance');

        function renderGuidance(phase) {
            guidanceElement.textContent = GUIDANCE_COPY[phase] ?? GUIDANCE_COPY.IDLE;
        }

        const deckRoot = new THREE.Group();
        deckRoot.position.set(0, -0.7, 0);
        cardGroup.add(deckRoot);

        const deckGlow = new THREE.Mesh(
            new THREE.PlaneGeometry(CONFIG.cardWidth * 1.16, CONFIG.cardHeight * 1.12),
            new THREE.MeshBasicMaterial({
                color: 0xd9ae4b,
                transparent: true,
                opacity: 0.35,
                side: THREE.DoubleSide,
                depthWrite: false,
            }),
        );
        deckGlow.position.z = -0.06;
        deckRoot.add(deckGlow);

        const deckGeometry = new THREE.BoxGeometry(CONFIG.cardWidth, CONFIG.cardHeight, 0.025);
        for (let index = 0; index < 5; index += 1) {
            const edgeMaterial = new THREE.MeshStandardMaterial({
                color: 0x4d2b10,
                emissive: 0xd8ae52,
                emissiveIntensity: 0.75,
                roughness: 0.35,
                metalness: 0.7,
            });
            const faceMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                map: deckBackTexture,
                roughness: 0.55,
                metalness: 0.1,
            });
            const layer = new THREE.Mesh(deckGeometry, [
                edgeMaterial, edgeMaterial, edgeMaterial, edgeMaterial, faceMaterial, faceMaterial,
            ]);
            layer.position.set(0, index * 0.035, index * 0.035);
            layer.userData = { isDeck: true };
            deckRoot.add(layer);
        }

        const deckTargetBounds = {
            halfWidth: CONFIG.cardWidth / 2,
            halfHeight: CONFIG.cardHeight / 2,
        };

        function setDeckVisualState(phase) {
            const active = phase === "AIMING";
            deckRoot.position.y = active ? -0.55 : -0.7;
            deckGlow.material.opacity = active ? 0.75 : 0.35;
            deckRoot.scale.setScalar(active ? 1.08 : 1);
        }

        const revealZoneShape = new THREE.Shape();
        const revealZoneWidth = CONFIG.cardWidth * 1.18;
        const revealZoneHeight = CONFIG.cardHeight * 1.12;
        const revealZoneRadius = 0.24;
        const zoneLeft = -revealZoneWidth / 2;
        const zoneBottom = -revealZoneHeight / 2;
        revealZoneShape.moveTo(zoneLeft + revealZoneRadius, zoneBottom);
        revealZoneShape.lineTo(zoneLeft + revealZoneWidth - revealZoneRadius, zoneBottom);
        revealZoneShape.quadraticCurveTo(zoneLeft + revealZoneWidth, zoneBottom, zoneLeft + revealZoneWidth, zoneBottom + revealZoneRadius);
        revealZoneShape.lineTo(zoneLeft + revealZoneWidth, zoneBottom + revealZoneHeight - revealZoneRadius);
        revealZoneShape.quadraticCurveTo(zoneLeft + revealZoneWidth, zoneBottom + revealZoneHeight, zoneLeft + revealZoneWidth - revealZoneRadius, zoneBottom + revealZoneHeight);
        revealZoneShape.lineTo(zoneLeft + revealZoneRadius, zoneBottom + revealZoneHeight);
        revealZoneShape.quadraticCurveTo(zoneLeft, zoneBottom + revealZoneHeight, zoneLeft, zoneBottom + revealZoneHeight - revealZoneRadius);
        revealZoneShape.lineTo(zoneLeft, zoneBottom + revealZoneRadius);
        revealZoneShape.quadraticCurveTo(zoneLeft, zoneBottom, zoneLeft + revealZoneRadius, zoneBottom);

        const revealZone = new THREE.Mesh(
            new THREE.ShapeGeometry(revealZoneShape),
            new THREE.MeshBasicMaterial({
                color: 0xd8ae52,
                transparent: true,
                opacity: 0.16,
                side: THREE.DoubleSide,
                depthWrite: false,
            }),
        );
        revealZone.position.set(0, 0.45, 7.7);
        revealZone.visible = false;
        scene.add(revealZone);

        const revealZoneHitArea = new THREE.Mesh(
            new THREE.PlaneGeometry(revealZoneWidth, revealZoneHeight),
            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }),
        );
        revealZoneHitArea.position.copy(revealZone.position);
        revealZoneHitArea.userData = { isRevealZone: true };
        scene.add(revealZoneHitArea);

        const revealZoneBounds = {
            halfWidth: revealZoneWidth / 2,
            halfHeight: revealZoneHeight / 2,
            halfDepth: 0.5,
        };

        function setRevealZoneVisualState(phase) {
            const visible = phase === "DRAGGING" || phase === "READY_TO_CONFIRM";
            revealZone.visible = visible;
            revealZone.material.opacity = phase === "READY_TO_CONFIRM" ? 0.34 : 0.16;
        }

        function renderInteractionPhase(phase) {
            renderGuidance(phase);
            setDeckVisualState(phase);
            setRevealZoneVisualState(phase);
        }

        renderInteractionPhase("IDLE");

        // --- Ash Logic ---
        function triggerAshEffect(mesh) {
            // Sample positions from mesh
            mesh.updateMatrixWorld();
            const center = mesh.position.clone();
            const width = CONFIG.cardWidth;
            const height = CONFIG.cardHeight;

            // Update particle arrays
            const positions = particleSystem.geometry.attributes.position.array;
            
            for(let i=0; i < particleCount; i++) {
                // Random point inside the card volume
                const lx = (Math.random() - 0.5) * width;
                const ly = (Math.random() - 0.5) * height;
                const lz = (Math.random() - 0.5) * 0.1;

                // Transform local to world (simplified rotation handling)
                const p = new THREE.Vector3(lx, ly, lz).applyQuaternion(mesh.quaternion).add(center);

                positions[i*3] = p.x;
                positions[i*3+1] = p.y;
                positions[i*3+2] = p.z;

                pLife[i] = 1.0; // Full life
                
                // Random velocity (upward with spread)
                pVel[i*3] = (Math.random() - 0.5) * 0.5; // X
                pVel[i*3+1] = Math.random() * 1.5 + 0.5; // Y (Up)
                pVel[i*3+2] = (Math.random() - 0.5) * 0.5; // Z
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            
            // Remove the mesh
            scene.remove(mesh);
        }

        function updateParticles(dt) {
            const positions = particleSystem.geometry.attributes.position.array;
            let active = false;

            for(let i=0; i < particleCount; i++) {
                if (pLife[i] > 0) {
                    active = true;
                    pLife[i] -= dt / CONFIG.particleLife;

                    // Turbulence / Noise approximation
                    const time = Date.now() * 0.001;
                    const noise = Math.sin(time * 5 + positions[i*3+1]) * 0.02;

                    positions[i*3] += (pVel[i*3] + noise) * dt;
                    positions[i*3+1] += pVel[i*3+1] * dt;
                    positions[i*3+2] += pVel[i*3+2] * dt;
                } else {
                    positions[i*3] = 9999; // Hide
                }
            }
            
            if(active) {
                particleSystem.geometry.attributes.position.needsUpdate = true;
                // Fade effect via material opacity global hack (or per vertex color ideally)
                // For simplicity, we just let them scatter.
            }
        }

        // --- Interaction Logic ---

        function drawRandomCard() {
            if (STATE.deck.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * STATE.deck.length);
            const cardId = STATE.deck.splice(randomIndex, 1)[0];
            document.getElementById('deck-count').innerText = STATE.deck.length;

            const isReversed = Math.random() < 0.5;
            const cardData = TAROT_DATA.find(c => c.id === cardId);

            return { data: cardData, isReversed };
        }

        function createHeldCard() {
            const draw = drawRandomCard();
            if(!draw) return;

            STATE.drawnCardData = draw;

            // Geometry
            const geometry = new THREE.BoxGeometry(CONFIG.cardWidth, CONFIG.cardHeight, 0.02);
            
            // Materials (Back and Front)
            // Note: BoxGeometry UV mapping for materials array: [Right, Left, Top, Bottom, Front, Back]
            // We need to verify standard Box mapping. Usually 4 is Front, 5 is Back.
            
            // Load specific texture
            const tex = textureLoader.load(draw.data.img, undefined, undefined, () => {
                // Error fallback
                materialArray[4].map = defaultFront;
            });
            tex.colorSpace = THREE.SRGBColorSpace;

            const matSide = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const matBack = new THREE.MeshStandardMaterial({ map: deckBackTexture });
            const matFront = new THREE.MeshStandardMaterial({ map: tex, transparent: true });

            const materialArray = [matSide, matSide, matSide, matSide, matFront, matBack];

            const mesh = new THREE.Mesh(geometry, materialArray);
            
            // Initial position (at the altar's current world position)
            deckRoot.updateWorldMatrix(true, false);
            const deckWorldPosition = deckRoot.getWorldPosition(new THREE.Vector3());
            mesh.position.copy(deckWorldPosition);
            
            // Orientation
            if (draw.isReversed) {
               // Reversed: Rotate 180 on Z so image is upside down
               mesh.rotation.z = Math.PI;
            }

            // Start invisible/small? No, just appear at hand
            scene.add(mesh);
            STATE.heldCard = mesh;
            return mesh;
        }

        function confirmResult() {
            if (interaction.phase !== "REVEALED" || !STATE.heldCard || STATE.locked) return;
            STATE.locked = true;
            const revealedCard = STATE.heldCard;

            const data = STATE.drawnCardData.data;
            const isRev = STATE.drawnCardData.isReversed;
            
            // 1. UI Show
            const title = document.getElementById('result-title');
            const meaning = document.getElementById('result-meaning');
            const display = document.getElementById('result-display');
            
            let nameText = data.name;
            if(isRev) nameText += " <span class='reversed-tag'>逆位 (Reversed)</span>";
            
            title.innerHTML = nameText;
            meaning.innerText = isRev ? data.meaningRev : data.meaningUp;
            
            display.style.opacity = 1;

            // 2. History Log
            const historyPanel = document.getElementById('history-panel');
            const log = document.createElement('div');
            log.className = 'history-item';
            log.innerHTML = `<span class="history-name">${data.name} ${isRev ? '(逆)' : ''}</span>`;
            historyPanel.prepend(log);

            // 3. Keep the revealed card visible, then reset after delay
            setTimeout(() => {
                display.style.opacity = 0;
                STATE.locked = false;
                scene.remove(revealedCard);
                if (STATE.heldCard === revealedCard) {
                    STATE.heldCard = null;
                }
                const pointerWasOverDeck = inputEdges.pointerOverDeck;
                inputEdges = resetInputEdgeState();
                dispatchInteraction({ type: "RESET" });
                if (pointerWasOverDeck) {
                    inputEdges = updateInputEdgeState(inputEdges, "pointerOverDeck", true).state;
                    dispatchInteraction({ type: "POINTER_ENTER_DECK" });
                }
            }, 4000);
        }

        function isHeldCardInsideRevealZone() {
            if (!STATE.heldCard) return false;

            const localCardPosition = revealZoneHitArea.worldToLocal(STATE.heldCard.position.clone());
            return isPointInsideRevealZone(localCardPosition, revealZoneBounds);
        }

        function updateInteraction(dt) {
            if (STATE.locked) return;

            // Raycasting
            raycaster.setFromCamera(STATE.pointer, camera);
            const intersects = raycaster.intersectObjects(cardGroup.children, true);
            
            // Visual Cursor
            const vector = new THREE.Vector3(STATE.pointer.x, STATE.pointer.y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = (0 - camera.position.z) / dir.z; // Project to Z=0 plane
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            
            // Smooth cursor movement
            cursorMesh.position.lerp(pos, 0.2);
            
            // --- Logic ---
            const gesture = STATE.gesture;
            const isPinch = (gesture === 'PINCH' && STATE.mode === 'gesture') || (STATE.mode === 'mouse' && STATE.isInteracting);
            const isFist = (gesture === 'FIST' && STATE.mode === 'gesture');
            deckRoot.updateWorldMatrix(true, false);
            const deckLocalPoint = deckRoot.worldToLocal(pos.clone());
            const hitDeck = (
                intersects.some(hit => hit.object.userData.isDeck) ||
                isPointInsideDeckTarget(deckLocalPoint, deckTargetBounds)
            );

            const deckPointerEdge = updateInputEdgeState(inputEdges, "pointerOverDeck", hitDeck);
            inputEdges = deckPointerEdge.state;
            if (deckPointerEdge.changed) {
                dispatchInteraction({
                    type: hitDeck ? "POINTER_ENTER_DECK" : "POINTER_LEAVE_DECK",
                });
            }

            // Colorize cursor based on state
            if (isPinch) cursorMesh.material.color.set(0xff00ff);
            else if (isFist) cursorMesh.material.color.set(0xff0000);
            else cursorMesh.material.color.set(0x00ffff);

            // 1. Grabbing Card
            const grabEdge = updateInputEdgeState(inputEdges, "grabActive", isPinch);
            inputEdges = grabEdge.state;
            if (grabEdge.rising && interaction.phase === "AIMING") {
                dispatchInteraction({ type: "GRAB" });
            }

            // 2. Dragging Card
            if (STATE.heldCard) {
                // Target position: slightly in front of camera, following cursor
                const targetPos = pos.clone();
                targetPos.z = 8; // Bring close to camera
                targetPos.y += 0.5; // Slightly above finger

                STATE.heldCard.position.lerp(targetPos, CONFIG.dragSpeed);
                
                // Slight rotation following movement
                STATE.heldCard.rotation.y = (STATE.pointer.x * 0.5);
                if(STATE.drawnCardData.isReversed) {
                     STATE.heldCard.rotation.z = Math.PI + (STATE.pointer.x * 0.1);
                } else {
                     STATE.heldCard.rotation.z = (STATE.pointer.x * 0.1);
                }

                const cardInRevealZone = isHeldCardInsideRevealZone();
                const revealZoneEdge = updateInputEdgeState(
                    inputEdges,
                    "heldCardInRevealZone",
                    cardInRevealZone,
                );
                inputEdges = revealZoneEdge.state;
                if (revealZoneEdge.changed) {
                    dispatchInteraction({
                        type: cardInRevealZone ? "ENTER_REVEAL_ZONE" : "LEAVE_REVEAL_ZONE",
                    });
                }
            }

            const fistEdge = updateInputEdgeState(inputEdges, "fistActive", isFist);
            inputEdges = fistEdge.state;
            if (fistEdge.rising && interaction.phase === "READY_TO_CONFIRM") {
                dispatchInteraction({ type: "CONFIRM" });
            }
        }

        // --- MediaPipe Hands Setup ---
        const videoElement = document.getElementById('input_video');
        const statusText = document.getElementById('status-text');
        const gestureIcon = document.getElementById('gesture-icon');

        function onResults(results) {
            if (STATE.mode !== 'gesture') return;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                STATE.handVisible = true;
                statusText.innerText = "已连接";
                statusText.style.color = "#0f0";
                
                const landmarks = results.multiHandLandmarks[0];
                
                // Get Index Finger Tip (8) and Thumb Tip (4) coordinates
                // MediaPipe coords: x (0-1), y (0-1). 
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                const wrist = landmarks[0];

                // Calculate pointer position (Center of Index and Thumb)
                const palmX = (indexTip.x + thumbTip.x) / 2;
                const palmY = (indexTip.y + thumbTip.y) / 2;

                // Map to Three.js NDC (-1 to 1)
                // Note: Video is mirrored usually, so flip X
                STATE.pointer.x = (1.0 - palmX) * 2 - 1; 
                STATE.pointer.y = -(palmY * 2) + 1;

                // --- Gesture Logic ---
                
                // 1. Distance for Pinch (Index to Thumb)
                const dx = indexTip.x - thumbTip.x;
                const dy = indexTip.y - thumbTip.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // 2. Fist Detection (Fingers curled down)
                // Simple check: Tip y > PIP y (y increases downwards)
                const isFist = (
                    middleTip.y > landmarks[10].y && 
                    ringTip.y > landmarks[14].y && 
                    pinkyTip.y > landmarks[18].y &&
                    indexTip.y > landmarks[6].y
                );

                if (isFist) {
                    STATE.gesture = 'FIST';
                    gestureIcon.innerText = '✊';
                } else if (dist < CONFIG.zIndexPinch) {
                    STATE.gesture = 'PINCH';
                    gestureIcon.innerText = '👌';
                } else {
                    STATE.gesture = 'OPEN';
                    gestureIcon.innerText = '✋';
                }

            } else {
                STATE.handVisible = false;
                statusText.innerText = "未检测到手部";
                statusText.style.color = "#ff0";
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // Camera Utils
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                if(STATE.mode === 'gesture') await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        // Start Camera
        cameraUtils.start().then(() => {
            document.getElementById('loading').style.display = 'none';
        }).catch(err => {
            console.error(err);
            document.getElementById('loading').innerText = "摄像头失败，切换至鼠标模式";
            setTimeout(() => {
                toggleMode(true);
                document.getElementById('loading').style.display = 'none';
            }, 2000);
        });

        // --- Mouse Fallback ---
        function toggleMode(forceMouse = false) {
            const btn = document.getElementById('btn-mode');
            if (STATE.mode === 'gesture' || forceMouse) {
                STATE.mode = 'mouse';
                btn.innerText = "切换模式: 🖱️ 鼠标";
                statusText.innerText = "鼠标模式";
                videoElement.pause();
                // Reset gesture state
                STATE.gesture = 'OPEN'; 
            } else {
                STATE.mode = 'gesture';
                btn.innerText = "切换模式: ✋ 手势";
                videoElement.play();
            }
        }

        document.getElementById('btn-mode').addEventListener('click', () => toggleMode());

        window.addEventListener('mousemove', (e) => {
            if (STATE.mode === 'mouse') {
                STATE.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
                STATE.pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            }
        });

        window.addEventListener('mousedown', () => {
            if(STATE.mode === 'mouse') STATE.isInteracting = true;
        });

        window.addEventListener('mouseup', () => {
            if(STATE.mode === 'mouse') {
                STATE.isInteracting = false;
                if (interaction.phase === "READY_TO_CONFIRM") {
                    dispatchInteraction({ type: "CONFIRM" });
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            updateInteraction(dt);
            updateParticles(dt);

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
